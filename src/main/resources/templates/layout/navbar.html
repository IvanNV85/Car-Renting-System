<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <!-- Logo / Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-car-front-fill text-primary fs-4"></i>
            <span class="fw-bold">FU Car Renting</span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                </li>
                <!-- Menu dành riêng cho Admin -->
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle text-warning fw-semibold" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-shield-lock-fill me-1"></i> Quản Trị
                    </a>
                    <ul class="dropdown-menu shadow">
                        <li><a class="dropdown-item" th:href="@{/admin/cars}"><i class="bi bi-car-front me-2"></i>Quản lý xe</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/rentals}"><i class="bi bi-file-earmark-text me-2"></i>Quản lý đơn thuê</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/customers}"><i class="bi bi-people me-2"></i>Quản lý khách hàng</a></li>
                    </ul>
                </li>
            </ul>

            <!-- Khối người dùng: Chưa đăng nhập vs Đã đăng nhập -->
            <div class="d-flex align-items-center gap-2">
                <!-- Khi chưa đăng nhập -->
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3 rounded-pill">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập
                    </a>
                    <a th:href="@{/register}" class="btn btn-primary btn-sm px-3 rounded-pill shadow-sm">
                        <i class="bi bi-person-plus me-1"></i> Đăng Ký
                    </a>
                </div>

                <!-- Khi đã đăng nhập -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-dark dropdown-toggle d-flex align-items-center gap-2 border border-secondary rounded-pill px-3 py-1" 
                            type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5 text-primary"></i>
                        <span sec:authentication="name" class="fw-semibold small">Tài khoản</span>
                        <span class="badge bg-primary ms-1" sec:authorize="hasRole('ADMIN')">Admin</span>
                        <span class="badge bg-success ms-1" sec:authorize="hasRole('CUSTOMER')">Khách hàng</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <h6 class="dropdown-header text-truncate" style="max-width: 200px;">
                                <i class="bi bi-envelope me-1"></i> <span sec:authentication="name">User</span>
                            </h6>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="bi bi-person me-2"></i> Thông tin cá nhân
                            </a>
                        </li>
                        <li sec:authorize="hasRole('CUSTOMER')">
                            <a class="dropdown-item" th:href="@{/my-rentals}">
                                <i class="bi bi-clock-history me-2"></i> Lịch sử thuê xe
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger d-flex align-items-center">
                                    <i class="bi bi-box-arrow-right me-2"></i> Đăng Xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</html>
