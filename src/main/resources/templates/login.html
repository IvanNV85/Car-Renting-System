<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#main-content}, ~{::#page-css}, ~{::#page-scripts})}">
<head>
    <title>Đăng Nhập - FU Car Renting System</title>
    <th:block id="page-css">
        <style>
            .login-card {
                max-width: 440px;
                width: 100%;
                background: #ffffff;
                border-radius: 1.25rem;
                box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
                overflow: hidden;
                border: 1px solid rgba(0, 0, 0, 0.06);
            }
            .login-header {
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                color: #ffffff;
                padding: 2.2rem 2rem 1.8rem;
                text-align: center;
            }
            .brand-icon {
                width: 60px;
                height: 60px;
                background: rgba(255, 255, 255, 0.12);
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 1.8rem;
                margin-bottom: 0.75rem;
                color: #38bdf8;
            }
            .input-group-text {
                background-color: #f8fafc;
                border-color: #dee2e6;
                color: #64748b;
            }
        </style>
    </th:block>
</head>
<body>

<div id="main-content" class="container py-5 d-flex align-items-center justify-content-center">
    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <div class="brand-icon">
                <i class="bi bi-car-front-fill"></i>
            </div>
            <h4 class="fw-bold mb-1">FU Car Renting</h4>
            <p class="mb-0 text-white-50 small">Đăng nhập để quản lý và đặt xe trực tuyến</p>
        </div>

        <!-- Body Form -->
        <div class="p-4 p-sm-5">
            <!-- Thông báo đăng ký thành công nếu có -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <div th:text="${successMessage}">Đăng ký thành công!</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Thông báo lỗi đăng nhập -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div th:text="${errorMessage}">Đăng nhập thất bại!</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Thông báo đăng xuất -->
            <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                <div th:text="${infoMessage}">Đã đăng xuất.</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/login}" method="post">
                <!-- Username / Email -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-secondary small">Email hoặc Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               placeholder="Nhập email hoặc tên tài khoản"
                               required
                               autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="Nhập mật khẩu của bạn"
                               required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold rounded-3 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập
                    </button>
                </div>
            </form>

            <!-- Divider -->
            <div class="position-relative my-4 text-center">
                <hr class="text-muted">
                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">Hoặc</span>
            </div>

            <!-- Register Link -->
            <div class="text-center">
                <p class="text-secondary small mb-2">Chưa có tài khoản?</p>
                <a th:href="@{/register}" class="btn btn-outline-primary w-100 rounded-3 fw-semibold py-2">
                    <i class="bi bi-person-plus-fill me-1"></i> Đăng Ký Tài Khoản Mới
                </a>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/}" class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left"></i> Quay lại trang chủ
                </a>
            </div>
        </div>
    </div>
</div>

<th:block id="page-scripts">
    <script>
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener('click', function () {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleIcon.classList.toggle('bi-eye', !isPassword);
                toggleIcon.classList.toggle('bi-eye-slash', isPassword);
            });
        }
    </script>
</th:block>

</body>
</html>
